<script>
"use strict";
const app=document.getElementById('app');
const S={view:'home',role:'employee',user:null,tab:'media',album:'all',albums:[],media:[],users:[],secrets:[],q:'',fails:0,settings:[],logins:[],lq:'',lr:'',eq:'',ec:'',dEdit:false,dDraft:null,dSel:'title',dMsg:''};
const urls={};let db;
/* ---------- helpers ---------- */
function h(t,p,...k){const e=document.createElement(t);for(const x in(p||{})){const v=p[x];if(v==null||v===false)continue;if(x==='class')e.className=v;else if(x.startsWith('on')||x in e)e[x]=v;else e.setAttribute(x,v)}
 k.flat().forEach(c=>{if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c))});return e}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmt=n=>n>1e9?(n/1e9).toFixed(2)+' GB':n>1e6?(n/1e6).toFixed(1)+' MB':Math.max(1,Math.round(n/1e3))+' KB';
const CH=15*1048576,blobs={};
const url=m=>m.blob?(urls[m.id]||(urls[m.id]=URL.createObjectURL(m.blob))):(m.chunks&&m.chunks.length===1)?'/_blob/'+m.chunks[0]:(urls[m.id]||null);

async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ea:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'p:'+p}}
/* ---------- storage (IndexedDB) ---------- */
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('event-archive',3);r.onupgradeneeded=()=>['users','albums','media','secrets','settings'].forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(s,m,f)=>new Promise((res,rej)=>{const t=db.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)});
const iAll=s=>tx(s,'readonly',o=>o.getAll()),iPut=(s,v)=>tx(s,'readwrite',o=>o.put(v)),iDel=(s,id)=>tx(s,'readwrite',o=>o.delete(id));

async function put(s,v){if(SYNC){const d={...v};delete d.blob;delete d.id;await SYNC.db.collection(s).doc(v.id).set(d)}else{await iPut(s,v);ping()}const L=S[s],i=L.findIndex(x=>x.id===v.id);if(i<0)L.push(v);else L[i]=v}

const refresh=async()=>{if(!SYNC){[S.albums,S.media,S.users,S.secrets,S.settings]=await Promise.all([iAll('albums'),iAll('media'),iAll('users'),iAll('secrets'),iAll('settings')])}};
const restricted=()=>S.user&&S.user.role!=='admin'&&Array.isArray(S.user.albums);
const canSee=m=>!restricted()||S.user.albums.includes(m.albumId||'');
const visAlbums=()=>restricted()?S.albums.filter(a=>S.user.albums.includes(a.id)):S.albums;
const isAdm=()=>!!S.user&&S.user.role==='admin',isMod=()=>!!S.user&&S.user.role==='moderator',isStaff=()=>isAdm()||isMod();
const can=k=>isAdm()||(isMod()&&!!(S.user.perms&&S.user.perms[k]));

const PERMS=[['Archive',[['upload','Upload photos & videos'],['editMedia','Edit file titles & albums'],['deleteMedia','Delete photos & videos'],['download','Download by album (bulk)'],['albums','Create, rename & delete albums']]],
 ['Employees',[['empView','Open Manage Access & view employee records'],['empAdd','Add employee accounts'],['empEdit','Edit employee company & album access'],['empPw','Change employee passwords'],['empRemove','Remove employee accounts']]],
 ['Sign-in page',[['design','Edit the sign-in page design']]],['Activity',[['viewLog','View sign-in activity (who signed in, and when)']]]];
const ALLP=PERMS.flatMap(g=>g[1].map(x=>x[0]));
const permText=x=>{const on=PERMS.flatMap(g=>g[1]).filter(([k])=>x.perms&&x.perms[k]).map(([,t])=>t);return on.length?on.join(', '):'View only (monitoring)'};
const needAdmin=()=>{if(!S.user||S.user.role!=='admin')throw new Error('Administrator access required')};
/* ---------- auth ---------- */
const signout=()=>{try{sessionStorage.removeItem('uid')}catch(e){}S.user=null;S.view='home';render()};
async function signin(u,p){const x=S.users.find(a=>a.username===u.trim().toLowerCase());
 if(!x||!(S.role==='admin'?(x.role==='admin'||x.role==='moderator'):x.role===S.role)||x.pw!==await hash(p)||(SYNC&&x.role!=='employee'&&!SYNC.edit))return false;
 S.fails=0;S.user=x;S.view='dash';S.tab='media';S.album='all';try{sessionStorage.setItem('uid',x.id)}catch(e){}logSignin(x);return true}
/* ---------- UI primitives ---------- */
function modal(title,body,narrow){const ov=h('div',{class:'ov',onclick:e=>{if(e.target===ov)close()}});const close=()=>{ov.remove();unlock()};

 i.onkeydown=e=>{if(e.key==='Enter')go()};
 c=modal(title,h('div',{},h('label',{},label),i,er,h('div',{class:'ft'},h('button',{class:'btn ghost',onclick:()=>c()},'Cancel'),h('button',{class:'btn',onclick:go},'Save'))),true);i.focus()}
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
async function saveBlob(b,name){try{const d=await claude.use('downloads');if(d){await d.save({filename:name,data:b});return}}catch(e){if(e&&e.code==='declined')return}

async function clearLog(){if(!confirm('Clear the whole sign-in log for everyone? This cannot be undone.'))return;
 try{needAdmin();if(SYNC){for(const d of S.logins.slice())await del('logins',d.id)}else{const r=S.settings.find(y=>y.id==='loginlog');if(r){r.entries=[];await put('settings',r)}}render()}catch(e){alert('Could not clear the log: '+e.message)}}
function activity(){let rows=[];const box=h('div',{class:'tbw'}),cnt=h('small',{style:'color:var(--mu)'}),ROLE={admin:'Administrator',moderator:'Moderator',employee:'Employee'};
 const draw=()=>{rows=logRows();const t=S.lq.trim().toLowerCase(),l=rows.filter(r=>(!S.lr||r.role===S.lr)&&(!t||[r.name,r.username,r.company,r.dev].some(v=>(v||'').toLowerCase().includes(t))));
  cnt.textContent='Showing '+Math.min(l.length,300)+' of '+rows.length+' recorded sign-ins'+(l.length>300?' (latest 300 listed; Export CSV has all)':'');
  box.replaceChildren(l.length?h('table',{class:'lg'},h('thead',{},h('tr',{},['Full name','Username','Role','Company','Signed in','Device'].map(c=>h('th',{},c)))),h('tbody',{},l.slice(0,300).map(r=>h('tr',{},h('td',{},h('b',{},r.name||'')),h('td',{},r.username||''),h('td',{},h('span',{class:'rl'},ROLE[r.role]||r.role||'')),h('td',{},r.company||'\u2014'),h('td',{},tstr(r.t)),h('td',{},r.dev||'\u2014'))))):h('p',{style:'color:var(--mu)'},rows.length?'No sign-ins match your search.':'No sign-ins recorded yet. New sign-ins appear here instantly on every device.'))};
 activity.draw=draw;
 const sq=h('input',{type:'search',placeholder:'Search name, username or company',value:S.lq,style:'flex:1;min-width:200px',oninput:e=>{S.lq=e.target.value;draw()}}),
  sr=h('select',{style:'width:auto;min-width:150px',onchange:e=>{S.lr=e.target.value;draw()}},[['','All roles'],['admin','Administrator'],['moderator','Moderator'],['employee','Employee']].map(([v,t])=>h('option',{value:v,selected:S.lr===v},t)));
 const csv=()=>{const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';saveBlob(new Blob(['\ufeff'+['Full name,Username,Role,Company,Signed in,Device'].concat(rows.map(r=>[r.name,r.username,ROLE[r.role]||r.role,r.company,tstr(r.t),r.dev].map(q).join(','))).join('\r\n')],{type:'text/csv'}),'Sign-in-activity.csv').catch(()=>{})};
 draw();
 return h('main',{style:'max-width:1000px;margin:0 auto;width:100%'},h('div',{class:'pn'},h('h3',{},'Sign-in activity'),h('p',{style:'color:var(--mu);margin:0 0 10px'},'Who signed in, with full name, username and the exact date and time. This list updates live on every device.'+(SYNC?' Employee sign-ins are recorded when the employee\u2019s device may save shared data (Contributor access to this site); administrator and moderator sign-ins are always recorded.':'')),
  h('div',{style:'display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px'},sq,sr,h('button',{class:'btn ghost sm',onclick:csv},'Export CSV'),isAdm()&&h('button',{class:'btn dn sm',onclick:clearLog},'Clear log')),cnt,box))}
/* ---------- shared live sync (desktop, Android, iOS) ---------- */
const SY={st:'re',last:0,unsub:[],ok:0,bk:0,dirty:false};
const SYL={on:'Live sync',re:'Reconnecting\u2026',off:'Offline',loc:'This device only'};
function paintSt(e){const k=SYNC?SY.st:'loc';e.className='syn '+(k==='loc'?'off':k);e.replaceChildren(h('i'),SYL[k])}
function synEl(){const e=h('span',{id:'syn',title:SYNC?'Changes sync instantly across all devices':'Not connected to shared storage: data stays on this device only'});paintSt(e);return e}
function setSt(k){SY.st=k;const e=document.getElementById('syn');if(e)paintSt(e)}
async function initSync(){try{if(!window.claude||!window.claude.use)return null;const[d,a,u]=await Promise.all([window.claude.use('db'),window.claude.use('assets'),window.claude.use('user')]);if(!d)return null;let edit=false,me=null,vid=null;try{edit=!!(u&&await u.canEdit())}catch(e){}try{const m=u&&await u.me();me=(m&&m.id)||null}catch(e){}try{vid=u&&await u.id()}catch(e){}return{db:d,assets:a,edit,me,vid}}catch(e){return null}}
const NSET=()=>['users','albums','media','settings'].concat(SYNC.edit?['secrets','logins']:[]),dr=q=>q.docs.map(d=>({...d.data(),id:d.id}));
/* one-shot read of every collection: at start, and whenever the phone or tab wakes up */
async function pull(){const ns=NSET(),r=await Promise.all(ns.map(n=>SYNC.db.collection(n).get().then(q=>[n,dr(q)],()=>null)));let ok=0;r.forEach(x=>{if(x){S[x[0]]=x[1];ok++}});if(ok)SY.last=Date.now();return ok===ns.length?2:ok?1:0}
function listen(){SY.unsub.forEach(f=>{try{f()}catch(e){}});SY.unsub=NSET().map(n=>SYNC.db.collection(n).onSnapshot(q=>{S[n]=dr(q);SY.last=Date.now();SY.bk=0;if(!q.metadata.fromCache)setSt('on');changed(n)},
 e=>{if(e&&e.code==='revoked'){setSt('off');return}setSt('re');clearTimeout(SY.rt);SY.rt=setTimeout(listen,Math.min(30000,1500*Math.pow(2,SY.bk++)))}))}
const sig=()=>SYNC?JSON.stringify(NSET().map(n=>S[n])):'';
let wk=0;async function wake(){if(!SYNC||document.hidden||Date.now()-wk<3000)return;wk=Date.now();try{const b=sig(),ok=await pull();setSt(ok?'on':'re');if(ok&&sig()!==b)changed('*')}catch(e){setSt('re')}}
['visibilitychange','focus','pageshow','online'].forEach(ev=>addEventListener(ev,()=>{if(ev==='online'||!document.hidden)wake()}));
addEventListener('offline',()=>{if(SYNC)setSt('re')});
setInterval(()=>{if(SYNC&&!document.hidden&&Date.now()-SY.last>40000)wake()},15000);
/* local (this-browser) mode: keep other tabs of the same browser in step */
function ping(){try{localStorage.setItem('ea-ping',String(Date.now()))}catch(e){}}
addEventListener('storage',async e=>{if(e.key!=='ea-ping'||SYNC||!db)return;try{await refresh();changed('*')}catch(_){}});
/* redraw only what changed, never while the person is typing or a dialog is open (keeps the phone keyboard and forms intact) */
const busy=()=>!!document.querySelector('.ov')||S.dEdit||/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'');
function changed(n){clearTimeout(SY.q);SY.q=setTimeout(()=>refreshUI(n),250)}
function unlock(){if(!document.querySelector('.ov'))document.documentElement.classList.remove('lock');setTimeout(()=>{if(SY.dirty&&!busy()){SY.dirty=false;refreshUI('full')}},300)}
document.addEventListener('focusout',()=>setTimeout(()=>{if(SY.dirty&&!busy()){SY.dirty=false;refreshUI('full')}},700));
function refreshUI(n){const y=window.scrollY;
 if(S.view==='home'){if(n!=='logins'&&n!=='secrets')render();return}
 if(S.view!=='dash'||!S.user)return;
 let chg=false;
 if(S.users.length){const u=S.users.find(z=>z.id===S.user.id);
  if(!u){if(SY.gone){SY.gone=0;signout();return}SY.gone=1;setTimeout(()=>refreshUI('users'),2500);return}
  SY.gone=0;chg=JSON.stringify(u)!==JSON.stringify(S.user);S.user=u}
 const T=S.tab,rel={media:['media','albums'],staff:['users','albums','secrets'],design:['settings']}[T]||[];
 if(T==='log'){if((n==='logins'||n==='*'||n==='full')&&activity.draw)activity.draw();if(!chg)return}
 else if(T==='media'&&(n==='media'||n==='*')&&!chg){grid();const a=document.querySelector('aside');if(a)a.replaceWith(side());return}
 else if(!chg&&n!=='full'&&n!=='*'&&!rel.includes(n))return;
 if(busy()){SY.dirty=true;return}
 render();window.scrollTo(0,y)}
/* ---------- default administrator (no setup screen) ---------- */
const DEF_ADMIN={username:'admin',password:'Admin@12345',name:'Administrator'};
async function seedAdmin(){if(S.users.some(u=>u.role==='admin'))return;if(SYNC&&(!SYNC.edit||SY.ok!==2))return;
 try{await put('users',{id:'admin-default',name:DEF_ADMIN.name,username:DEF_ADMIN.username,role:'admin',pw:await hash(DEF_ADMIN.password)})}catch(e){}}
/* ---------- boot ---------- */
function render(){app.replaceChildren(S.view==='dash'&&S.user?dash():S.view==='login'?login():home())}
async function boot(){try{SYNC=await initSync();
 if(SYNC){let ok=0;for(let i=0;i<3&&!ok;i++){try{ok=await pull()}catch(e){}if(!ok)await new Promise(r=>setTimeout(r,900*(i+1)))}
  if(!ok)throw new Error('offline');SY.ok=ok;setSt('on');listen()}
 else{db=await open();await refresh()}
 await seedAdmin();
 let id=null;try{id=sessionStorage.getItem('uid')}catch(e){}
 const x=S.users.find(u=>u.id===id);if(x){S.user=x;S.view='dash'}render()}
 catch(e){app.replaceChildren(h('section',{class:'hero'},h('h1',{},SYNC?'Cannot reach shared storage':'Storage unavailable'),h('p',{},SYNC?'Please check your internet connection and try again.':'This archive needs browser storage. Please disable private browsing and reload.'),h('button',{class:'btn',onclick:()=>{app.replaceChildren();boot()}},'Try again')))}}
boot();
</script>
